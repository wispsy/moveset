[project]
name = "moveset"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Explicit linear composition of selected Python capabilities."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ellainng" }]
dependencies = ["hidden-moves>=0.1.0"]

[project.optional-dependencies]
sequence = ["func-seq>=0.1.0 ; python_version >= '3.14'"]

[project.urls]
Source = "https://github.com/wispsy/moveset"
Issues = "https://github.com/wispsy/moveset/issues"
Project = "https://github.com/orgs/wispsy/projects/23"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["LICENSE", "tests/*.py", "scripts/*.py", "docs/*.md", "lifecycle_tests/*.py"]
